<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>儲蓄型比較｜報價工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/quote.css?v=7">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">報價工具</a>
    <nav>
      <a href="index.html">首頁</a>
      <a href="protection.html">保障型</a>
      <a href="savings.html">儲蓄型</a>
      <a href="compare.html" aria-current="page">比較</a>
      <a href="real-estate/">房產</a>
    </nav>
  </header>
  <main class="sheet">
    <section class="family-card">
      <header class="family-head">
        <div class="family-brand">
          <h1>儲蓄型比較</h1>
        </div>
        <p class="rule" aria-hidden="true"><span></span></p>
      </header>
      <div class="family-body">
        <p class="tag" id="sourceNote"></p>
        <section class="panel">
          <header><h2>並排</h2><span class="tag">〔最多四檔〕</span></header>
          <label for="find">搜尋代號或名稱</label>
          <input id="find" type="search" inputmode="search" placeholder="例如 FAK、美滿" autocomplete="off">
          <div class="two">
            <div>
              <label for="age">年齡</label>
              <input id="age" type="text" inputmode="numeric" value="30" autocomplete="off">
            </div>
            <div>
              <label for="sex">性別</label>
              <select id="sex">
                <option value="1">男</option>
                <option value="2">女</option>
              </select>
            </div>
          </div>
          <label for="term">繳費年期</label>
          <select id="term"></select>
          <div class="choices" id="basis">
            <label><input type="radio" name="basis" value="sum" checked> 同保額比較</label>
            <label><input type="radio" name="basis" value="premium"> 同保費比較</label>
          </div>
          <div id="premiumBox" hidden>
            <div class="two">
              <div>
                <label for="premium">年繳保費</label>
                <input id="premium" type="text" inputmode="decimal" value="6000" autocomplete="off">
              </div>
              <div>
                <label for="currency">幣別</label>
                <select id="currency">
                  <option value="USD">USD</option>
                  <option value="TWD">台幣</option>
                  <option value="AUD">AUD</option>
                </select>
              </div>
            </div>
          </div>
          <div class="row-head"><h2>全部商品</h2><span class="tag" id="count"></span></div>
          <div class="catalog" id="all"></div>
          <div class="grid" id="slots"></div>
          <p class="demo">全部商品可直接捲動瀏覽，點一下加入比較，最多同時 4 檔。所有商品用上面這個繳費年期。沒有該年期就標無此年期，不會改用別的年期。同保額用各商品自己的試算保額。同保費用這筆年繳保費，依該年齡與性別的費率反推買得到的保額。保費買不到最低保額、超過上限，或幣別不同，會標示而不另算。沒有該年解約金就標無資料。紅利與宣告利率非保證。</p>
          <p><button class="gold" id="run" type="button">比較</button></p>
          <p class="error" id="error" hidden></p>
        </section>
        <section class="panel" id="out" hidden>
          <header><h2>摘要</h2><span class="tag">〔第 5、10、15 年〕</span></header>
          <div class="entries" id="cards"></div>
          <div class="scroll"><table>
            <thead id="heads"></thead>
            <tbody id="body"></tbody>
          </table></div>
        </section>
      </div>
      <footer class="foot">
        <span>個人試算工具，實際保費、核保與給付以公司正式建議書及保單條款為準</span>
        <strong data-version>DEMO-0</strong>
      </footer>
    </section>
  </main>
  <script type="module" src="js/app-compare.js?v=9"></script>
</body>
</html>
