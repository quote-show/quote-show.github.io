<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>主約＋附約｜藝世錄報價工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/quote.css?v=2">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html"><img src="/assets/logo.png" alt="">藝世錄報價工具</a>
    <nav>
      <a href="index.html">首頁</a>
      <a href="protection.html">保障型</a>
      <a href="bundle.html" aria-current="page">組合</a>
      <a href="savings.html">儲蓄型</a>
      <a href="compare.html">比較</a>
    </nav>
  </header>
  <main class="sheet">
    <section class="family-card">
      <header class="family-head">
        <div class="family-brand">
          <span class="badge"><img src="/assets/logo.png" alt=""></span>
          <h1>主約＋附約</h1>
        </div>
        <p class="rule" aria-hidden="true"><span></span></p>
      </header>
      <div class="family-body">
        <p class="tag"><a href="waiver.html">豁免附約比較</a></p>
        <section class="panel">
          <header><h2>被保險人</h2><span class="tag" id="ageTag">〔保險年齡〕</span></header>
          <div class="grid">
            <div>
              <label for="birth">生日</label>
              <input id="birth" type="date" value="1996-01-15">
            </div>
            <div>
              <label for="age">保險年齡</label>
              <input id="age" type="number" min="0" max="90" value="30">
            </div>
            <div class="choices">
              <label><input type="radio" name="sex" value="1" checked>男</label>
              <label><input type="radio" name="sex" value="2">女</label>
            </div>
            <div>
              <label for="occ">職業類別</label>
              <select id="occ"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
            </div>
            <div class="two">
              <div>
                <label for="parentAge">要保人年齡</label>
                <input id="parentAge" type="number" min="0" max="99" placeholder="親子型豁免">
              </div>
              <div>
                <label for="lifeEx">既有壽險（萬）</label>
                <input id="lifeEx" type="number" min="0" value="0">
              </div>
            </div>
            <div>
              <label for="spec">特定身分</label>
              <select id="spec">
                <option value="">無</option>
                <option value="kid">孩童／學生</option>
                <option value="home">家管／退休／無業／待業</option>
              </select>
            </div>
          </div>
        </section>
        <section class="panel">
          <header><h2>主約</h2><span class="tag" id="mainLink"></span></header>
          <div class="grid">
            <div>
              <label for="main">商品</label>
              <select id="main"></select>
            </div>
            <div class="two">
              <div>
                <label for="term">年期</label>
                <select id="term"></select>
              </div>
              <div>
                <label for="sum">保額</label>
                <input id="sum" type="number" value="100">
              </div>
            </div>
            <div>
              <label for="mode">繳別</label>
              <select id="mode">
                <option value="annual">年繳</option>
                <option value="semi">半年繳</option>
                <option value="quarterly">季繳</option>
                <option value="monthly">月繳</option>
              </select>
            </div>
            <label class="choices"><input id="payDisc" type="checkbox" checked> 計入繳費方式折扣</label>
          </div>
        </section>
        <section class="panel">
          <header><h2>附約與豁免</h2><span class="tag">〔可附加的才列出〕</span></header>
          <div id="riders"></div>
        </section>
        <p class="error" id="error" hidden></p>
        <section class="panel" id="result" hidden>
          <header><h2>保費</h2><span class="tag" id="resultTag"></span></header>
          <div class="scroll"><table>
            <thead><tr><th>項目</th><th>年繳</th><th>本期</th><th>次年</th></tr></thead>
            <tbody id="lines"></tbody>
          </table></div>
          <p id="total" class="money"></p>
          <p id="rules" class="tag"></p>
        </section>
      </div>
      <footer class="foot">
        <span>個人試算工具，實際保費、核保與給付以公司正式建議書及保單條款為準</span>
        <strong data-version>DEMO-0</strong>
      </footer>
    </section>
  </main>
  <script type="module" src="js/app-bundle.js"></script>
</body>
</html>
